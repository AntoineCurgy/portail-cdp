<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Vos rapports, à télécharger.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Portail des rapports</title>
<!--
  Page provisoire, fonctionnelle : ni l'interface ni le parcours ne sont conçus
  (Antoine, 2026-10-03). Modèle suivi : la connexion par code des outils
  courants (Notion, Slack) — une adresse, un code reçu par courriel, puis la liste.
  Aucun secret ici : tout ce qui est servi au navigateur est public. La session
  vit dans un cookie HttpOnly posé par l'API, jamais dans le stockage du navigateur.
-->
<style>
  :root {
    --fond: #fafafa; --texte: #1f2328; --discret: #59636e; --bord: #d1d9e0;
    --accent: #0b5cad; --erreur: #b42318; --rayon: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #0d1117; --texte: #e6edf3; --discret: #9198a1; --bord: #3d444d; --accent: #4493f8; --erreur: #f85149; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background-color: var(--fond); color: var(--texte);
         font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 44rem; margin: 0 auto; padding: 2rem 1rem; display: flex; flex-direction: column; gap: 1.5rem; }
  h1 { font-size: 1.5rem; margin: 0; }
  form { display: flex; flex-direction: column; gap: .75rem; }
  label { font-weight: 600; }
  input { font: inherit; padding: .6rem .75rem; border: 1px solid var(--bord); border-radius: var(--rayon);
          background-color: transparent; color: inherit; }
  button, .bouton { font: inherit; padding: .6rem 1rem; border: 0; border-radius: var(--rayon); cursor: pointer;
           background-color: var(--accent); color: #fff; text-decoration: none; display: inline-block; text-align: center; }
  button.lien { background-color: transparent; color: var(--accent); padding: 0; text-decoration: underline; align-self: flex-start; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .discret { color: var(--discret); margin: 0; }
  .erreur { color: var(--erreur); margin: 0; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
  li { display: flex; gap: 1rem; align-items: center; justify-content: space-between;
       padding: .75rem 1rem; border: 1px solid var(--bord); border-radius: var(--rayon); }
  li p { margin: 0; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<script defer src="portail.js"></script>
</head>
<body>
<main>
  <h1>Vos rapports</h1>

  <form id="etape-adresse" novalidate>
    <label for="adresse">Votre adresse professionnelle</label>
    <input id="adresse" name="adresse" type="email" autocomplete="email" required>
    <button type="submit">Recevoir un code</button>
  </form>

  <form id="etape-code" hidden>
    <label for="code">Le code reçu par courriel</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
    <button type="submit">Se connecter</button>
    <button type="button" class="lien" id="changer-adresse">Changer d'adresse</button>
  </form>

  <section id="etape-liste" hidden aria-labelledby="titre-liste">
    <h2 id="titre-liste" class="discret">Dernière version de chaque rapport</h2>
    <ul id="rapports"></ul>
    <p><button type="button" class="lien" id="deconnexion">Se déconnecter</button></p>
  </section>

  <p id="message" class="discret" aria-live="polite"></p>
</main>
</body>
</html>
