<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Les rapports des automatisations de la Compagnie de Phalsbourg, et l'état de ces automatisations.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Connexion · Portail des rapports</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231c2b4a'/%3E%3Ctext x='50' y='68' font-size='52' font-family='Georgia,serif' fill='%23faf8f3' text-anchor='middle'%3E88%3C/text%3E%3C/svg%3E">
<!--
  Le portail des rapports de la Compagnie de Phalsbourg, d'apres la maquette v14 validee
  par Antoine le 2026-10-04. Une page par ecran, sur le modele de l'app web KCP
  (2026-10-06) : commun.js porte ce qui est partage, chaque page a son script. Le bandeau,
  le rail et le pied sont recopies dans chaque page ; seul change aria-current.
  Aucun secret ici : tout ce qui est servi au navigateur est public. La session vit dans
  un cookie HttpOnly pose par l'API. logo-cdp.css est pose a la publication.
-->
<link rel="stylesheet" href="portail.css">
<link rel="stylesheet" href="logo-cdp.css">
<script defer src="commun.js"></script>
<script defer src="connexion.js"></script>
</head>
<body>
<a class="evitement" href="#contenu-connexion">Aller au contenu</a>

<header class="haut">
  <div class="b-in">
    <span class="logo-cdp lc-haut" role="img" aria-label="Compagnie de Phalsbourg"></span>
    <p class="b-t2"><span>Compagnie de Phalsbourg</span>Portail des rapports</p>
    <span class="b-sp"></span>
    <span class="b-op">opéré par <svg class="l88" width="24" height="24" viewBox="0 0 100 100" role="img" aria-label="88Systems"><rect width="100" height="100" rx="20" fill="#faf8f3"/><text x="50" y="68" font-size="52" font-family="Georgia,serif" fill="#1c2b4a" text-anchor="middle">88</text></svg></span>
  </div>
</header>

<div id="vue-connexion" class="vue-connexion">
  <main class="c1" id="contenu-connexion">
    <div class="carte-c">
      <h1 class="sr">Connexion au portail des rapports</h1>
      <ol class="etapes">
        <li class="on" id="etape-1"><span>1</span>Votre adresse</li>
        <li id="etape-2"><span>2</span>Le code reçu</li>
      </ol>
      <form id="f-adresse" novalidate>
        <label for="adresse">Votre adresse professionnelle</label>
        <input id="adresse" name="adresse" class="champ" type="email" autocomplete="email" placeholder="prenom.nom@compagniedephalsbourg.com" required aria-describedby="message-connexion">
        <button class="btn plein" type="submit">Continuer</button>
      </form>
      <form id="f-code" novalidate hidden>
        <p class="envoye">Un code vient de partir vers <strong id="adresse-envoyee"></strong>.</p>
        <label for="chiffre-1">Le code reçu par courriel</label>
        <div class="cases" role="group" aria-label="Code à six chiffres" aria-describedby="aide-code">
          <input class="case-c" id="chiffre-1" inputmode="numeric" maxlength="1" aria-label="Chiffre 1" autocomplete="one-time-code">
          <input class="case-c" inputmode="numeric" maxlength="1" aria-label="Chiffre 2" autocomplete="off">
          <input class="case-c" inputmode="numeric" maxlength="1" aria-label="Chiffre 3" autocomplete="off">
          <input class="case-c" inputmode="numeric" maxlength="1" aria-label="Chiffre 4" autocomplete="off">
          <input class="case-c" inputmode="numeric" maxlength="1" aria-label="Chiffre 5" autocomplete="off">
          <input class="case-c" inputmode="numeric" maxlength="1" aria-label="Chiffre 6" autocomplete="off">
        </div>
        <p id="aide-code" class="petit">Six chiffres, valable dix minutes.</p>
        <button class="btn plein" type="submit">Se connecter</button>
        <button class="lien" type="button" id="changer-adresse">Changer d'adresse</button>
      </form>
      <p class="message" id="message-connexion" aria-live="polite"></p>
    </div>
  </main>
  <p class="pc">© 2026 88Systems · Accès réservé aux équipes de la Compagnie de Phalsbourg</p>
</div>
</body>
</html>
